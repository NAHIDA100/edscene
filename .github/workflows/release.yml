name: release

# 产物只出现在 Release 附件里，永远不进 git 树（见 .gitignore 与卫生检查）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact: windows-x64-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev libfontconfig1-dev libxkbcommon-dev \
            pkg-config dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: 发布构建
        run: cargo build --release --locked --target ${{ matrix.target }} -p eds-app
      - name: 打包 Windows portable zip
        if: startsWith(matrix.artifact, 'windows')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ($env:GITHUB_REF -notmatch '^refs/tags/') { $ver = "0.0.0-ci" }
          $bin = "target/${{ matrix.target }}/release/edscene.exe"
          $stage = "pkg/edscene-$ver-${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $bin $stage
          Copy-Item README.md, NOTICE, LICENSE-code, LICENSE-content $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "edscene-$ver-${{ matrix.artifact }}.zip"
      - name: 打包 Linux deb + tar
        if: matrix.artifact == 'linux-x64'
        run: |
          VER="${GITHUB_REF_NAME:-0.0.0-ci}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) VER="0.0.0-ci";; esac
          VERSIONED="$VER" bash packaging/build-deb.sh "target/${{ matrix.target }}/release/edscene" "edscene_${VER}_amd64.deb"
          tar -C "target/${{ matrix.target }}/release" -czf "edscene-$VER-linux-x64.tar.gz" edscene
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: edscene-${{ matrix.artifact }}
          path: |
            *.zip
            *.deb
            *.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 校验和
        run: |
          cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            本仓库不含任何音频或游戏素材。装好后运行
            `edscene --sounds <你的播报音频文件夹>` 才能出声。

            校验：`sha256sum -c SHA256SUMS.txt`
