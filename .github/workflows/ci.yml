name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: 仓库卫生（禁音频 / 禁安装包 / 禁素材）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 扫描整棵树
        run: python scripts/check_repo_hygiene.py --all

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-msvc
          - os: windows-latest
            name: windows-gnu
            toolchain: x86_64-pc-windows-gnu
          - os: ubuntu-latest
            name: linux
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: 单元测试
        run: cargo test --workspace --locked
        env:
          CARGO_BUILD_TARGET: ${{ matrix.toolchain }}
      - name: 静态检查
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

  cross-check-linux-codec-path:
    name: 交叉类型检查（eds-linux）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --target linux
        run: cargo check -p eds-linux --target x86_64-unknown-linux-gnu --all-targets
