[workspace]
resolver = "2"
members = ["crates/eds-core"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT AND CC-BY-NC-ND-4.0"
repository = "https://github.com/edscene/edscene"

[workspace.dependencies]
eds-core = { path = "crates/eds-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
thiserror = "1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
